name: Robot Framework

on:
  push:
    branches: [master]
    paths:
      - "robot/**"
  pull_request:
    paths:
      - "robot/**"

env:
  LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN_ROBOT }}
  LAUNCHABLE_DEBUG: 1
  LAUNCHABLE_REPORT_ERROR: 1

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework smart-tests-cli
      - run: smart-tests verify
      - name: Record build
        run: smart-tests record build --build ${GITHUB_RUN_ID} --source ..
      - name: Record session
        run: smart-tests record session --build ${GITHUB_RUN_ID} --test-suite robot > session.txt
      - name: Get subset
        run: |
          robot --dryrun --output test_list.xml .
          smart-tests subset --session @session.txt --target 100% robot test_list.xml > smart-tests-subset.txt
      - name: Test
        run: |
          function record() {
            smart-tests record tests --session @session.txt robot output.xml
          }
          trap record EXIT

          # Some test cases are intentionally failing as this is an example repository
          eval robot --output output.xml $(cat smart-tests-subset.txt) . || true
