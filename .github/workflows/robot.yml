name: Robot Framework

on:
  push:
    branches: [master]
    paths:
      - "robot/**"
  pull_request:
    paths:
      - "robot/**"

env:
  LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN_ROBOT }}
  LAUNCHABLE_DEBUG: 1
  LAUNCHABLE_REPORT_ERROR: 1

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: robot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
          pip install "launchable @ git+https://github.com/cloudbees-oss/smart-tests-cli.git@fix/LCHIB-750-robot-nested-classname-v1"
      - run: launchable verify
      - name: Record build
        run: launchable record build --name ${GITHUB_RUN_ID} --source ..
      - name: Record session
        run: launchable record session --build ${GITHUB_RUN_ID} --test-suite robot > session.txt
      - name: Get subset
        run: |
          robot --dryrun --output test_list.xml .
          launchable subset --session $(cat session.txt) --target 100% robot test_list.xml > launchable-subset.txt
      - name: Test
        run: |
          function record() {
            launchable record tests --session $(cat session.txt) robot output.xml
          }
          trap record EXIT

          # Some test cases are intentionally failing as this is an example repository
          eval robot --output output.xml $(cat launchable-subset.txt) . || true
